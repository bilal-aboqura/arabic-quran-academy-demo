services:
  postgres-rehearsal:
    image: postgres:16-alpine
    container_name: nexaclass-postgres-rehearsal
    environment:
      POSTGRES_USER: nexaclass
      POSTGRES_PASSWORD: nexaclass_dev_only
      POSTGRES_DB: nexaclass_rehearsal
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaclass -d nexaclass_rehearsal"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - nexaclass_rehearsal_postgres:/var/lib/postgresql/data

volumes:
  nexaclass_rehearsal_postgres:
